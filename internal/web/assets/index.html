<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>keepsess · Terminal</title><link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="style.css"></head>
<body>
<aside><div class="brand"><span class="logo">k›</span><div>keepsess<small>SESSION OBSERVATORY</small></div></div><label class="field">实例 / 历史归档<select id="instances"></select></label><div class="sidebar-heading">SESSIONS <span id="count">0</span></div><div id="sessions"></div><footer><span id="connection" class="muted">连接中…</span><button id="refresh" class="quiet">刷新目录</button></footer></aside>
<aside id="task-sidebar" class="task-sidebar" hidden><div class="sidebar-heading">TASKS <span id="task-count">0</span></div><div id="task-session" class="muted"></div><nav id="tasks" class="tasks" aria-label="当前会话任务"></nav></aside>
<main><header><div><span class="eyebrow">PERSISTENT TERMINAL</span><h1 id="title">选择一个会话</h1><div id="subtitle" class="muted">实时观察 · 历史保留 · 默认只读</div></div><div class="controls"><label>滚动历史 <input id="scrollback" type="number" min="100" max="200000" step="100" value="5000"> 行</label><button id="apply" class="quiet">应用</button><button id="unlock" disabled>只读 · 点击解锁</button></div></header>
<div id="warning" role="status" hidden></div>
<section class="terminal-panel"><div class="terminal-bar"><span id="terminal-label">TERMINAL</span><span id="mode" class="muted">READ ONLY</span></div><div id="empty">会话创建后会显示在这里。<br><small>关闭的会话仍可查看；旧实例在左上角归档中。</small></div><div id="terminal"></div><div id="loading" hidden>正在回放历史…</div></section>
<form id="exec" hidden><label class="field">命令<textarea id="command" rows="2" placeholder="输入命令；每次执行创建独立任务"></textarea></label><div class="exec-options"><input id="cwd" placeholder="cwd（可选，默认登录目录）"><label><input id="interactive" type="checkbox"> interactive</label><label><input id="pty" type="checkbox"> PTY</label><button id="run" type="submit" disabled>执行</button></div></form>
<div class="bottom"><span id="status">默认只读。解锁后才能发送输入。</span><label><input id="echo" type="checkbox"> 本地回显</label></div><details><summary>输入记录与发送回执</summary><pre id="receipts">终端输入可能包含密码等敏感内容，并会保存在本机历史中。</pre></details>
</main><script src="vendor/xterm.js"></script><script src="app.js"></script></body></html>
